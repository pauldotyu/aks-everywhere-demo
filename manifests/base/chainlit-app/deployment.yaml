apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainlit-app
spec:
  selector:
    matchLabels:
      name: chainlit-app
  template:
    metadata:
      labels:
        name: chainlit-app
    spec:
      containers:
        - name: chainlit-app
          image: ghcr.io/pauldotyu/aks-everywhere-demo/app:0.1.0
          env:
            - name: MODEL_NAME
              value: ""
            - name: MODEL_API_KEY
              value: ""
            - name: MODEL_BASE_URL
              value: ""
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources: {}
